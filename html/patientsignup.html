<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up as patient</title>
    <link rel="stylesheet" href="/css/Signin.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css" rel="stylesheet">
</head>
<body>
    <header class="auth-header">
        <a href="#" class="logo">
            <span class="logo-icon"><i class="ri-heart-pulse-line"></i></span>
            <span>Nova <strong>Medics</strong></span>
        </a>

        <a href="/html/Signin.html" class="back-link">
            <i class="ri-arrow-left-line"></i>
            Back to sign in
        </a>
    </header>

    <main class="form-page">

        <section class="form-card">

            <div class="form-heading">
                <span class="form-icon"><i class="ri-user-add-line"></i></span>
                <p class="intro-label">PATIENT REGISTRATION</p>
                <h1>Create your account</h1>
                <p>Enter your details to get started with Nova Medics.</p>
            </div>

            <form action="#" method="post">

                <div class="form-row">
                    <div class="form-group">
                        <label for="first-name">First name</label>
                        <input type="text" id="first-name" name="first-name" placeholder="Enter first name" required>
                    </div>

                    <div class="form-group">
                        <label for="last-name">Last name</label>
                        <input type="text" id="last-name" name="last-name" placeholder="Enter last name" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="email">Email address</label>
                    <input type="email" id="email" name="email" placeholder="you@example.com" required>
                </div>

                <div class="form-group">
                    <label for="phone">Phone number</label>
                    <input type="tel" id="phone" name="phone" placeholder="Enter phone number" required>
                </div>

                <div class="form-group">
                    <label for="password">Create password</label>
                    <input type="password" id="password" name="password" placeholder="Create a password" required>
                    <small class="field-help">Use a password that is difficult for others to guess.</small>
                </div>

                <div class="form-group">
                    <label for="confirm-password">Confirm password</label>
                    <input type="password" id="confirm-password" name="confirm-password" placeholder="Enter password again" required>
                </div>

                <label class="terms-check">
                    <input type="checkbox" name="terms" required>
                    <span>I agree to the terms and privacy policy.</span>
                </label>

                <button type="submit" class="button button-primary">
                    Create Account
                    <i class="ri-arrow-right-line"></i>
                </button>

            </form>

            <p class="form-switch">
                Already have an account?
                <a href="/html/patientSignin.html">Sign in</a>
            </p>

        </section>

    </main>

    <footer class="auth-footer">
        <p>© 2026 Nova Medics. All rights reserved.</p>
        <p>Care that puts you first.</p>
    </footer>    
</body>
</html>
